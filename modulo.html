<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Módulo — MichiHub Educación</title>
<script src="modulos-datos.js"></script>
<style>
:root{--bg:#f4f0ea;--text:#4a4238;--soft:#7a6f60;--accent:#8a5a34;--card:#fff;--line:rgba(74,66,56,.14);--ok:#e7f0e5;--bad:#f4e3e1}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,sans-serif;line-height:1.6}.wrap{max-width:680px;margin:auto;padding:0 20px}header{text-align:center;padding:40px 0 25px;border-bottom:1px solid var(--line)}h1,h2,h3{font-family:Georgia,serif}h1{font-size:1.7rem;font-style:italic}a{color:var(--accent)}.bar{background:#eee7db;padding:12px;text-align:center}.bar input,.bar button{padding:7px;border-radius:8px;border:1px solid #b09e8d}.bar button,.btn{background:var(--accent);color:#fff;cursor:pointer}.bar button{margin-left:6px}section{padding:30px 0}.card,.question{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px 22px;margin:0 0 14px}.question p{font-weight:bold}.option{display:block;padding:9px;border-radius:8px}.option:hover{background:#eee7db}.btn{border:0;border-radius:999px;padding:12px 26px;font-weight:bold}.center{text-align:center}.hidden{display:none}.result{text-align:center;border-radius:16px;padding:25px}.pass{background:var(--ok)}.fail{background:var(--bad)}footer{text-align:center;padding:25px;color:var(--soft);font-size:.85rem}
</style>
</head>
<body>
<header><div class="wrap"><div>MichiHub Educación</div><h1 id="title">Cargando módulo…</h1><p><a href="index.html">← Ruta completa</a> · <a href="progreso.html">Mi progreso</a></p></div></header>
<div class="bar"><div class="wrap" id="emailbar">Cargando…</div></div>
<section id="lesson"><div class="wrap"><div id="topics"></div><p class="center"><button class="btn" id="show-test">Ir a la evaluación</button></p></div></section>
<section id="test" class="hidden"><div class="wrap"><h2>Evaluación del módulo</h2><p id="count"></p><div id="questions"></div><p class="center"><button class="btn" id="submit">Enviar respuestas</button></p></div></section>
<section id="result" class="hidden"><div class="wrap"><div id="resultbox" class="result"></div></div></section>
<footer>MichiHub Educación · <a href="index.html">Volver a la ruta</a></footer>
<script>
(function(){
 const n=parseInt(new URLSearchParams(location.search).get('m'))||1;
 const data=Array.isArray(window.MODULOS)?window.MODULOS:[];
 const mod=data.find(x=>x.id===n);
 const title=document.getElementById('title'),topics=document.getElementById('topics'),questions=document.getElementById('questions');
 let email=localStorage.getItem('michihubEmail')||'';
 function emailBar(){const b=document.getElementById('emailbar');if(email){b.innerHTML='Evaluando como <strong>'+email+'</strong> · <button id="change">cambiar</button>';document.getElementById('change').onclick=()=>{email='';localStorage.removeItem('michihubEmail');emailBar()}}else{b.innerHTML='Escribe tu correo para guardar tu progreso: <input id="email" type="email" placeholder="michihub@hotmail.com"><button id="save">Usar este correo</button>';document.getElementById('save').onclick=()=>{const v=document.getElementById('email').value.trim();if(!v.includes('@'))return alert('Escribe un correo válido.');email=v;localStorage.setItem('michihubEmail',v);emailBar()}}}
 emailBar();
 if(!mod){title.textContent='Módulo no encontrado';return}
 title.textContent='Módulo '+mod.id+' — '+mod.titulo;
 (mod.temas||[]).forEach(t=>{const d=document.createElement('div');d.className='card';d.innerHTML='<h3>'+t.n+'</h3><p>'+t.d+'</p>';topics.appendChild(d)});
 document.getElementById('count').textContent=(mod.preguntas||[]).length+' preguntas · necesitas 80/100 para aprobar.';
 (mod.preguntas||[]).forEach((q,i)=>{const d=document.createElement('div');d.className='question';d.innerHTML='<p>'+(i+1)+'. '+q.p+'</p>'+q.o.map((o,j)=>'<label class="option"><input type="radio" name="q'+i+'" value="'+j+'"> '+o+'</label>').join('');questions.appendChild(d)});
 document.getElementById('show-test').onclick=()=>{document.getElementById('test').classList.remove('hidden');document.getElementById('test').scrollIntoView({behavior:'smooth'})};
 document.getElementById('submit').onclick=()=>{let correct=0;for(let i=0;i<mod.preguntas.length;i++){const a=document.querySelector('input[name="q'+i+'"]:checked');if(!a)return alert('Contesta todas las preguntas antes de enviar.');if(+a.value===mod.preguntas[i].c)correct++}const score=Math.round(correct/mod.preguntas.length*100),passed=score>=80;
const historial=JSON.parse(localStorage.getItem('michihubProgreso')||'{}');
historial[email||'sin-correo'] = historial[email||'sin-correo'] || {};
historial[email||'sin-correo'][mod.id] = {modulo:mod.id,puntuacion:score,aprobado:passed,actualizado_en:new Date().toISOString()};
localStorage.setItem('michihubProgreso',JSON.stringify(historial));document.getElementById('lesson').classList.add('hidden');document.getElementById('test').classList.add('hidden');const box=document.getElementById('resultbox');box.className='result '+(passed?'pass':'fail');box.innerHTML='<h2>'+(passed?'¡Aprobado! 🐾':'Todavía no')+'</h2><div style="font-size:2.4rem">'+score+'/100</div><p>'+correct+' de '+mod.preguntas.length+' respuestas correctas.</p>'+(passed?'<p>El módulo quedó aprobado.</p>':'<p>Necesitas 80/100. Puedes volver a intentarlo.</p><button class="btn" onclick="location.reload()">Reintentar</button>');document.getElementById('result').classList.remove('hidden');document.getElementById('result').scrollIntoView({behavior:'smooth'})};
})();
</script>
</body>
</html>
