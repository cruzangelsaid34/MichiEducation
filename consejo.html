<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Consejo del día — michiEducation</title>
<style>
:root{--bg:#f4f0ea;--text:#4a4238;--soft:#7a6f60;--accent:#8a5a34;--card:#fff;--line:rgba(74,66,56,.14)}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:var(--bg);color:var(--text);font-family:Arial,sans-serif}.wrap{width:100%;max-width:760px;text-align:center}.brand{color:var(--accent);font-size:.9rem;font-weight:800;letter-spacing:.12em;text-transform:uppercase}h1{margin:10px 0;font-family:Georgia,serif;font-size:clamp(2.2rem,7vw,4rem)}.intro{color:var(--soft);line-height:1.6}.card{margin-top:28px;padding:clamp(30px,7vw,65px) clamp(22px,7vw,70px);background:var(--card);border:1px solid var(--line);border-radius:24px;box-shadow:0 16px 45px rgba(74,66,56,.12)}.date{color:var(--accent);font-weight:800}.quote{margin:20px 0;font-family:Georgia,serif;font-size:clamp(1.5rem,4vw,2.5rem);font-style:italic;line-height:1.35}.topic{display:inline-block;padding:6px 14px;border:1px solid var(--line);border-radius:999px;color:var(--soft);font-size:.85rem}.actions{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin-top:28px}button,a{padding:12px 20px;border:0;border-radius:999px;background:var(--accent);color:#fff;font:inherit;font-weight:800;cursor:pointer;text-decoration:none}a{background:var(--bg);color:var(--text);border:1px solid var(--line)}#msg{min-height:22px;margin-top:18px;color:var(--accent);font-size:.9rem}</style>
</head>
<body><main class="wrap"><div class="brand">michiEducation</div><h1>Consejo del día</h1><p class="intro">Una recomendación breve para mejorar tu forma de programar, aprender y construir software.</p><section class="card"><div id="date" class="date"></div><div id="topic" class="topic"></div><blockquote id="advice" class="quote"></blockquote><div class="actions"><button id="copy">Copiar consejo</button><button id="next">Otro consejo</button><a href="index.html">Volver al inicio</a></div><div id="msg" role="status"></div></section></main>
<script>
const consejos=[['Programación','Escribe código que otra persona pueda entender, mantener y mejorar.'],['IA','Usa la inteligencia artificial como apoyo para aprender, revisar y explorar; no como sustituto de tu criterio.'],['Desarrollo','Divide los problemas grandes en tareas pequeñas que puedas probar una por una.'],['Git','Haz commits pequeños y claros; así será más fácil entender y recuperar tu trabajo.'],['Seguridad','Nunca publiques contraseñas, claves privadas ni datos sensibles dentro del código.'],['Pruebas','Una función que funciona hoy merece una prueba que confirme que seguirá funcionando mañana.'],['Aprendizaje','No memorices solamente la solución: entiende por qué funciona.'],['Documentación','Un proyecto bien documentado permite que otros lo usen y que tú mismo lo retomes después.'],['Portafolio','Un proyecto terminado y publicado demuestra más que una lista de tecnologías.'],['Buenas prácticas','Primero haz que funcione; después mejóralo sin perder claridad ni seguridad.'],['Bases de datos','Valida y protege los datos antes de guardarlos o mostrarlos.'],['Constancia','Avanzar un poco cada día produce mejores resultados que estudiar solo cuando hay motivación.']];
const $=id=>document.getElementById(id);let indice=0;function fecha(){return new Date().toISOString().slice(0,10)}function indiceDia(f){let n=0;for(const c of f)n=(n*31+c.charCodeAt(0))%consejos.length;return n}function mostrar(i,dia=false){indice=(i+consejos.length)%consejos.length;$('topic').textContent=consejos[indice][0];$('advice').textContent=consejos[indice][1];$('date').textContent=dia?new Date().toLocaleDateString('es-MX',{weekday:'long',year:'numeric',month:'long',day:'numeric'}):'Consejo seleccionado';$('msg').textContent='';if(dia)localStorage.setItem('michiEducationConsejo',JSON.stringify({fecha:fecha(),indice}))}let guardado=JSON.parse(localStorage.getItem('michiEducationConsejo')||'null');if(guardado&&guardado.fecha===fecha())mostrar(guardado.indice,true);else mostrar(indiceDia(fecha()),true);$('next').onclick=()=>mostrar(indice+1);$('copy').onclick=async()=>{try{await navigator.clipboard.writeText($('topic').textContent+': '+$('advice').textContent);$('msg').textContent='Consejo copiado.'}catch(e){$('msg').textContent='Selecciona el texto para copiarlo.'}};
</script></body></html>
