<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Verificar certificado — michiEducation</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,600;1,700&family=Nunito:wght@400;600;700;800&display=swap');
:root{
    --bg:#f4f0ea; --bg-soft:#eee7db; --text:#4a4238; --text-soft:#7a6f60;
    --accent:#b09e8d; --accent-deep:#8a5a34; --card:#ffffff; --line:rgba(74,66,56,0.14);
    --ok:#4f7a4a; --ok-bg:#e7f0e5; --mal:#a3453b; --mal-bg:#f4e3e1;
}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--text);font-family:'Nunito',sans-serif;line-height:1.6;display:flex;align-items:center;justify-content:center;padding:24px}
h1,h2{font-family:'Playfair Display',serif;font-weight:700;margin:0}
.tarjeta{max-width:480px;width:100%;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:36px 30px;text-align:center}
.eyebrow{color:var(--accent-deep);font-weight:700;font-size:0.85rem}
h1{font-size:1.5rem;font-style:italic;margin:8px 0 24px}
.franja-buscar{display:flex;gap:8px;margin-bottom:20px}
.franja-buscar input{flex:1;font-family:inherit;font-size:0.95rem;padding:10px 12px;border:1px solid var(--accent);border-radius:10px}
.franja-buscar button{font-family:inherit;font-weight:700;background:var(--accent-deep);color:#fff;border:none;border-radius:10px;padding:10px 18px;cursor:pointer}
.resultado{border-radius:14px;padding:22px;margin-top:10px;text-align:left}
.resultado.valido{background:var(--ok-bg)}
.resultado.invalido{background:var(--mal-bg)}
.resultado h2{font-size:1.15rem;margin-bottom:10px}
.resultado.valido h2{color:var(--ok)}
.resultado.invalido h2{color:var(--mal)}
.resultado dl{margin:0;font-size:0.92rem}
.resultado dt{color:var(--text-soft);margin-top:8px}
.resultado dd{margin:0;font-weight:700}
.oculto{display:none}
footer{margin-top:24px;font-size:0.8rem;color:var(--text-soft)}
footer a{color:inherit}
</style>
</head>
<body>
<div class="tarjeta">
    <span class="eyebrow">michiEducation</span>
    <h1>Verificar certificado</h1>
    <div class="franja-buscar">
        <input type="text" id="input-folio" placeholder="Ej. MHE-2026-00001">
        <button id="btn-buscar">Verificar</button>
    </div>
    <div id="zona-resultado"></div>
    <footer><a href="index.html">michiEducation</a></footer>
</div>

<script>
const SUPABASE_URL = "https://veihvfcnczawoycphhga.supabase.co";
const SUPABASE_KEY = "sb_publishable_DpvZMjPgjcfxCpK5OTJRHw_ah2emZkb";
const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

async function verificar(folio){
    const zona = document.getElementById("zona-resultado");
    zona.innerHTML = "<p>Buscando…</p>";

    if(!folio){
        zona.innerHTML = "";
        return;
    }

    try{
        const { data } = await supabase
            .from("certificados_educacion")
            .select("nombre, folio, promedio, emitido_en")
            .eq("folio", folio.trim().toUpperCase())
            .maybeSingle();

        if(data){
            const fecha = new Date(data.emitido_en).toLocaleDateString("es-MX", { day:"numeric", month:"long", year:"numeric" });
            zona.innerHTML =
                '<div class="resultado valido">' +
                    "<h2>✅ Certificado válido</h2>" +
                    "<dl>" +
                        "<dt>Nombre</dt><dd>" + data.nombre + "</dd>" +
                        "<dt>Folio</dt><dd>" + data.folio + "</dd>" +
                        "<dt>Promedio</dt><dd>" + data.promedio + "/100</dd>" +
                        "<dt>Emitido</dt><dd>" + fecha + "</dd>" +
                        "<dt>Ruta</dt><dd>michiEducation — 18 módulos</dd>" +
                    "</dl>" +
                "</div>";
        }else{
            zona.innerHTML = '<div class="resultado invalido"><h2>❌ No encontrado</h2><p style="margin:0">Ese folio no corresponde a ningún certificado emitido por michiEducation.</p></div>';
        }
    }catch(err){
        console.warn("Error verificando el certificado:", err);
        zona.innerHTML = '<div class="resultado invalido"><h2>⚠️ No se pudo verificar</h2><p style="margin:0">Intenta de nuevo en un momento.</p></div>';
    }
}

document.getElementById("btn-buscar").addEventListener("click", () => {
    verificar(document.getElementById("input-folio").value);
});
document.getElementById("input-folio").addEventListener("keydown", (e) => {
    if(e.key === "Enter") verificar(document.getElementById("input-folio").value);
});

const folioURL = new URLSearchParams(location.search).get("folio");
if(folioURL){
    document.getElementById("input-folio").value = folioURL;
    verificar(folioURL);
}
</script>
</body>
</html>
